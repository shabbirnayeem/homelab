apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc
  namespace: arc-systems
spec:
  interval: 1h
  releaseName: arc
  install:
    createNamespace: true
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
      ref:
        tag: "0.15.1"
